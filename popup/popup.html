<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Declared in markup as well as CSS so Safari picks the popover
       appearance before the stylesheet loads (#86). -->
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../dist/popup.css">
</head>
<body>
  <div id="root"></div>
  <!-- Classic scripts — these modules are also loaded as content scripts, so
       they expose their API on globalThis. The React bundle reads them from
       window.WPRest / window.WPMySites. -->
  <script src="../lib/rest.js"></script>
  <script src="../lib/my-sites.js"></script>
  <script src="../dist/popup.js"></script>
</body>
</html>
